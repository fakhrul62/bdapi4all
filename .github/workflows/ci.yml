name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bdapi4all
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      HUSKY: 0
      DATABASE_INTEGRITY_TESTS: 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bdapi4all
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bdapi4all"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run security and API regression tests
        run: npm test

      - name: Validate API contract
        run: npm run contract:validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run Linter
        run: npm run lint

      - name: Build Python SDK wheel and verify import
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/python-sdk-wheel" packages/python-sdk
          python -m pip install --no-deps --target "$RUNNER_TEMP/python-sdk" "$RUNNER_TEMP"/python-sdk-wheel/bdapi4all-*.whl
          PYTHONPATH="$RUNNER_TEMP/python-sdk" python - <<'PY'
          from bdapi4all import BdApiClient

          client = BdApiClient(max_cache_entries=2)
          assert client.base_url.startswith("https://")
          client._set_cache("first", 1)
          client._set_cache("second", 2)
          assert client._get_cache("first") == 1
          client._set_cache("third", 3)
          assert client._get_cache("second") is None
          PY

      - name: Pack TypeScript SDK
        run: npm pack ./packages/ts-sdk --pack-destination "$RUNNER_TEMP"

      - name: Install and import packed TypeScript SDK
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-consumer"
          npm install --prefix "$RUNNER_TEMP/sdk-consumer" "$RUNNER_TEMP/bdapi4all-sdk-1.0.0.tgz" --ignore-scripts
          cd "$RUNNER_TEMP/sdk-consumer"
          node --input-type=module -e "import { BdApiClient } from '@bdapi4all/sdk'; new BdApiClient();"

      - name: Run Type Check
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Seed local test data
        run: node prisma/seed-docker.mjs

      - name: Smoke-test the production server
        run: |
          if [ -d public ]; then cp -r public .next/standalone/; fi
          cp -r .next/static .next/standalone/.next/
          npm run start > /tmp/bdapi4all-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node scripts/smoke-test.mjs
