name: Data Quality

on:
  schedule:
    - cron: '30 1 * * *'   # daily 01:30 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'prisma/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run data quality validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATA_QUALITY_WRITE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          DATA_QUALITY_FAIL_ON: high
        run: npm run data:quality
