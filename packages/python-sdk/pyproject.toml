[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bdapi4all"
version = "1.0.0"
description = "Official Python client for BDApi4All - free Bangladesh REST API"
license = "MIT"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
