name: bdapi4all-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: bdapi4all
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - bdapi4all

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bdapi4all
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bdapi4all
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.example.com/api/v1}
      CRON_SECRET: ${CRON_SECRET:?required}
      ADMIN_SECRET: ${ADMIN_SECRET:?required}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    networks:
      - bdapi4all

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npx prisma migrate deploy"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bdapi4all
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bdapi4all
    networks:
      - bdapi4all

  # Optional: reverse proxy for TLS/HTTPS (Caddy auto-provisions certs)
  # See docs/self-hosting.md for guidance.
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #   networks:
  #     - bdapi4all

volumes:
  db_data:
  caddy_data: